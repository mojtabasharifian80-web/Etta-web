name: Eitaa Telegram Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -U eitaa-cli

      - name: Check eitaa module
        run: |
          pip show eitaa-cli
          python -c "import pkgutil; print([m.name for m in pkgutil.iter_modules() if 'eitaa' in m.name.lower()])"

      - name: Run bot
        env:
          EITAA_SESSION: ${{ secrets.EITAA_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
